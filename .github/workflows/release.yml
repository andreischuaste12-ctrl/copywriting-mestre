name: Check and package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-validation.txt
      - run: python tools/release.py check
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - name: Build matching version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python tools/release.py build --out dist --expected-version "$RELEASE_VERSION"
      - run: python tools/release.py verify --directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: copywriter-master-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

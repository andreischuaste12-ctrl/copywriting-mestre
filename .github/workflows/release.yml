name: Check, package and publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-validation.txt
      - run: python tools/release.py check
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - name: Build matching version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python tools/release.py build --out dist --expected-version "$RELEASE_VERSION"
      - run: python tools/release.py verify --directory dist
      - name: Add installers so the release is self-contained
        run: cp install.sh install.ps1 dist/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: copywriter-master-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
  publish:
    # Installers download this release's archive and SHA256SUMS, so the release must exist for remote installs to work.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: copywriter-master-${{ github.ref_name }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Installable skill archive with SHA256SUMS. See CHANGELOG.md for changes."

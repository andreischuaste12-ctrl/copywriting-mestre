name: Validate skill package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-validation.txt
      - run: python tools/release.py check
      - if: runner.os != 'Windows'
        run: bash -n install.sh
      - run: python -m unittest discover -s tests -v
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-validation.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
      - name: Tests with coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=85
  powershell-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, update, dry run and uninstall with attribution
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'copywriter test skills'
          ./install.ps1 -Dest $dest -DryRun
          if (Test-Path $dest) { throw 'Dry run created a directory' }
          ./install.ps1 -Dest $dest
          ./install.ps1 -Dest $dest
          foreach ($name in @('LICENSE', 'NOTICE', 'schemas/brief.schema.json', 'schemas/output.schema.json')) {
            $source = if ($name.StartsWith('schemas/')) { Join-Path 'skills/copywriter-master' $name } else { $name }
            $expected = (Get-FileHash -LiteralPath $source).Hash
            $actual = (Get-FileHash -LiteralPath (Join-Path $dest "copywriter-master/$name")).Hash
            if ($expected -ne $actual) { throw "Installed $name differs" }
          }
          ./install.ps1 -Dest $dest -Uninstall
          if (Test-Path (Join-Path $dest 'copywriter-master')) { throw 'Uninstall failed' }
      - name: Remote install path (pinned release, checksum) from a directory mirror
        shell: pwsh
        run: |
          python -m pip install -r requirements-validation.txt
          $mirror = Join-Path $env:RUNNER_TEMP 'mirror'
          python tools/release.py build --out $mirror
          $alone = Join-Path $env:RUNNER_TEMP 'alone'
          New-Item -ItemType Directory -Path $alone | Out-Null
          Copy-Item install.ps1 $alone
          $dest = Join-Path $env:RUNNER_TEMP 'remote skills'
          $env:COPYWRITER_RELEASE_BASE_URL = $mirror
          & (Join-Path $alone 'install.ps1') -Dest $dest
          if (-not (Test-Path (Join-Path $dest 'copywriter-master/SKILL.md'))) { throw 'Remote install failed' }
          $version = (Get-Content VERSION).Trim()
          Set-Content -LiteralPath (Join-Path $mirror 'SHA256SUMS') -Value (('f' * 64) + "  copywriter-master-$version.zip")
          $failed = $false
          try { & (Join-Path $alone 'install.ps1') -Dest (Join-Path $env:RUNNER_TEMP 'tampered') } catch { $failed = $true }
          if (-not $failed) { throw 'Tampered checksum was accepted' }
      - name: Check both project installation targets
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'copywriter project test'
          New-Item -ItemType Directory -Path $project | Out-Null
          $installer = Join-Path $env:GITHUB_WORKSPACE 'install.ps1'
          Push-Location $project
          try {
            & $installer -Project
            foreach ($base in @('.claude', '.agents')) {
              $target = Join-Path $project "$base/skills/copywriter-master"
              foreach ($name in @('SKILL.md', 'LICENSE', 'NOTICE', 'runtime-contract.json', 'rules/validation.json')) {
                if (-not (Test-Path (Join-Path $target $name))) { throw "Project install missing $name" }
              }
            }
            & $installer -Project -Uninstall
            foreach ($base in @('.claude', '.agents')) {
              if (Test-Path (Join-Path $project "$base/skills/copywriter-master")) { throw 'Project uninstall failed' }
            }
          } finally { Pop-Location }
